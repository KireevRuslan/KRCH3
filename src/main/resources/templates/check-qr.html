
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка QR-кода</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
            background: #f4f6f8;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0001;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            border: none;
            background: #1769aa;
            color: white;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .error {
            margin-top: 20px;
            color: #b00020;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Проверка QR-кода</h1>

    <form action="/check-qr" method="post">
        <label for="uuid">Введите UUID участника:</label>
        <input
                id="uuid"
                type="text"
                name="uuid"
                placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
                required
        >
        <button type="submit">Проверить QR-код</button>
    </form>

    <div class="result" th:if="${fullName != null}">
        <h2>Участник найден</h2>

        <p>
            <strong>ФИО:</strong>
            <span th:text="${fullName}"></span>
        </p>

        <p>
            <strong>Новый UUID:</strong>
            <span th:text="${newUuid}"></span>
        </p>
    </div>

    <p class="error" th:if="${message != null}"
       th:text="${message}"></p>
</div>
</body>
</html>
