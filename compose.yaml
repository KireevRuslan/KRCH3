
services:
  postgres:
    image: postgres:18
    container_name: entry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: entry_db
      POSTGRES_USER: entry_user
      POSTGRES_PASSWORD: change_me_local
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
